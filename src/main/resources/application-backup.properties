server.port = 8081

spring.datasource.url=jdbc:mysql://localhost:3306/myspring?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=rootroot
spring.datasource.type=org.apache.tomcat.jdbc.pool.DataSource

# mybatis配置
mybatis.mapper-locations=classpath*:com/tom/springboot/tx/note/infrastructure/dao/**/*.xml
mybatis.config-location=classpath:mybatis-config.xml
check-config-location=true

# 静态资源配置
spring.web.resources.static-locations=classpath:/templates

# spring mybaits log
logging.level.org.springframework.transaction=TRACE
logging.level.org.springframework.jdbc.datasource=TRACE
logging.level.org.springframework.aop=DEBUG