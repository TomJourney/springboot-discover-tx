server:
  port: 8081
# data source config
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    password: rootroot
    type: org.apache.tomcat.jdbc.pool.DataSource
    url: jdbc:mysql://localhost:3306/myspring?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
  web:
    resources:
      static-locations: classpath:/templates
# mybatis config
mybatis:
  mapper-locations: classpath:com/tom/springboot/tx/note/infrastructure/dao/**/*Mapper.xml

# logging config
logging:
  level:
    org:
      springframework:
        aop: DEBUG
        jdbc:
          datasource: TRACE
        transaction: TRACE
      mybatis: DEBUG
      mybatis.spring: DEBUG