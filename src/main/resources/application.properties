server.port = 8081

# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/myspring?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=rootroot
spring.datasource.type=org.apache.tomcat.jdbc.pool.DataSource

# mybatis配置
mybatis.mapper-locations=classpath*:com/tom/springboot/tx/note/infrastructure/dao/**/*.xml,com/tom/tx/srccode/analysis/mapper/**/*.mapper.xml
mybatis.config-location=classpath:mybatis-config.xml
check-config-location=true

# 静态资源配置
spring.web.resources.static-locations=classpath:/templates

# tomcat-jdbc?????
spring.datasource.tomcat.initial-size=15
spring.datasource.tomcat.max-wait=20000
spring.datasource.tomcat.max-active=50
spring.datasource.tomcat.max-idle=15
spring.datasource.tomcat.min-idle=8
spring.datasource.tomcat.default-auto-commit=true